<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KY restaurant2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root {
    --green: #aee4bd;
    --green-dark: #9bd4a8;
    --accent: #4049b8;
    --border: #e0e0e0;
    --sub: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #111; background: #fff; line-height: 1.6;
  }
  .topbar { height: 12px; background: var(--green); }
  .wrap { width: min(92%, 1200px); margin: 0 auto; padding: 32px 0 80px; }

  .back {
    display: inline-block; margin-bottom: 28px;
    color: var(--accent); font-weight: 600; text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  h1 { font-size: clamp(1.8rem, 4.5vw, 3.2rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .desc { font-size: clamp(1rem, 2vw, 1.15rem); color: #2a2a2a; margin-bottom: 36px; }

  /* ▼ 카드 목록: 화면 폭에 따라 자동으로 1~4열 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; gap: 16px; }
  }

  .card {
    display: flex; flex-direction: column;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    color: inherit; text-decoration: none;
    background: #fff;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 10px 20px rgba(64, 73, 184, .12);
  }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 썸네일: 항상 16:10 비율 유지 */
  .thumb {
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    display: grid; place-items: center;
    font-size: 2.6rem;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: .95rem; color: var(--sub); line-height: 1.5; flex: 1; margin-bottom: 12px; }
  .status { font-size: .85rem; font-weight: 600; color: #aaa; }
  .status.ready { color: var(--accent); }

  /* ▼ 상세 화면의 콘텐츠 칸 */
  .embed {
    width: 100%;
    aspect-ratio: var(--ratio-pc, 16 / 9);
    max-height: 80vh;
    border: 2px dashed #c4c3dc;
    border-radius: 8px;
    display: grid; place-items: center;
    color: #9a99b8; text-align: center;
    overflow: hidden;
  }
  .embed.filled { border: none; }
  .embed iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 80vh) {
    .embed { aspect-ratio: var(--ratio-mobile, 3 / 4); max-height: none; }
  }

  .empty { color: var(--sub); padding: 40px 0; }
  .hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="topbar"></div>

  <main class="wrap">
    <a class="back" id="back" href="#">← 홈으로</a>
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>

    <div class="grid" id="grid"></div>
    <div class="embed hidden" id="embed"></div>
  </main>

<script>
  /* =========================================================
     ✏️ 여기만 고치면 됩니다

     카테고리마다 items 안에 { } 묶음을 추가하면 카드가 늘어나요.
       title : 카드 제목
       desc  : 카드 설명
       file  : 콘텐츠 파일 이름 (비워두면 "준비 중")
       thumb : 썸네일 이미지 파일 (비워두면 아이콘 표시)
       ratio : (선택) PC 화면 비율. 예: "16 / 9", "4 / 3", "1 / 1"
     ========================================================= */
  const HOME = "https://podo126.github.io/";

  const PAGES = {
    "minigame": {
      title: "미니게임",
      desc:  "간단하게 즐길 수 있는 다양한 미니게임들로 당신의 시간을 채워보세요.",
      icon:  "🎮",
      items: [
        { title: "서터레스 풀기", desc: "날 괴롭히는 것들이에용", file: "stress.html", thumb: "" },
        { title: "미니게임 2", desc: "두 번째 게임 설명", file: "", thumb: "" },
        { title: "미니게임 3", desc: "세 번째 게임 설명", file: "", thumb: "" }
      ]
    },
    "3d-model": {
      title: "3D 모델",
      desc:  "현실감 넘치는 3D 모델들을 직접 돌려보고 확대하며 탐험해보세요.",
      icon:  "🧊",
      items: [
        { title: "3D 모델 1", desc: "모델 설명", file: "", thumb: "" }
      ]
    },
    "psych-test": {
      title: "심리테스트",
      desc:  "흥미로운 질문들로 당신의 성향과 숨겨진 모습을 알아보세요.",
      icon:  "🧠",
      items: [
        { title: "심리테스트 1", desc: "테스트 설명", file: "", thumb: "" }
      ]
    },
    "virtual-tour": {
      title: "체험형 콘텐츠",
      desc:  "클릭하고 조작하며 직접 경험하는 색다른 콘텐츠를 즐겨보세요!",
      icon:  "🌍",
      items: [
        { title: "엑셀 그림판", desc: "'쿵야' 입력 시 전환 / 도움말 > 단축키 / Esc 키 누를 시...", file: "Drowing_Sheet.html", thumb: "" }
      ]
    },
    "story": {
      title: "멀티 콘텐츠",
      desc:  "친구와 함께하는 협동 콘텐츠",
      icon:  "📖",
      items: [
        { title: "2p 멀티 협동", desc: "~~게임 설명~~", file: "2p_multi.html", thumb: "" }
      ]
    },
    "ar": {
      title: "AR 경험",
      desc:  "증강 현실을 통해 현실 세계와 디지털 콘텐츠가 결합된 새로운 경험을 해보세요.",
      icon:  "🔮",
      items: [
        { title: "AR 1", desc: "AR 설명", file: "", thumb: "" }
      ]
    }
  };
  /* ========================================================= */

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const type = params.get("type");
  const itemNo = params.get("item");
  const page = PAGES[type];

  if (!page) showError();
  else if (itemNo !== null) showDetail(page, Number(itemNo));
  else showList(page);

  /* 카테고리 → 카드 목록 */
  function showList(page) {
    document.title = page.title + " | KY restaurant2";
    $("back").href = HOME;
    $("title").textContent = page.title;
    $("desc").textContent = page.desc;

    const grid = $("grid");
    if (!page.items || page.items.length === 0) {
      grid.outerHTML = '<p class="empty">아직 등록된 콘텐츠가 없습니다.</p>';
      return;
    }

    page.items.forEach((item, i) => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = `?type=${type}&item=${i}`;

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if (item.thumb) {
        const img = document.createElement("img");
        img.src = item.thumb;
        img.alt = "";
        img.loading = "lazy";
        thumb.appendChild(img);
      } else {
        thumb.textContent = page.icon || "📦";
      }

      const body = document.createElement("div");
      body.className = "card-body";
      body.innerHTML = `
        <h2 class="card-title"></h2>
        <p class="card-desc"></p>
        <span class="status ${item.file ? "ready" : ""}">${item.file ? "바로 보기" : "준비 중"}</span>`;
      body.querySelector(".card-title").textContent = item.title;
      body.querySelector(".card-desc").textContent = item.desc;

      card.append(thumb, body);
      grid.appendChild(card);
    });
  }

  /* 카드 → 콘텐츠 상세 */
  function showDetail(page, i) {
    const item = page.items && page.items[i];
    if (!item) return showError();

    document.title = item.title + " | " + page.title;
    $("back").href = `?type=${type}`;
    $("back").textContent = `← ${page.title} 목록으로`;
    $("title").textContent = item.title;
    $("desc").textContent = item.desc;
    $("grid").remove();

    const embed = $("embed");
    embed.classList.remove("hidden");
    if (item.ratio) embed.style.setProperty("--ratio-pc", item.ratio);

    if (item.file) {
      const frame = document.createElement("iframe");
      frame.src = item.file;
      frame.title = item.title;
      frame.allow = "camera; fullscreen; xr-spatial-tracking; accelerometer; gyroscope";
      frame.allowFullscreen = true;
      embed.appendChild(frame);
      embed.classList.add("filled");
    } else {
      embed.textContent = item.title + " 콘텐츠 준비 중입니다.";
    }
  }

  function showError() {
    $("back").href = HOME;
    $("title").textContent = "페이지를 찾을 수 없습니다";
    $("desc").textContent = "홈으로 돌아가 카테고리를 다시 선택하세요.";
    $("grid").remove();
  }
</script>
</body>
</html>
